<title>Menu Hari Ini — Shakies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDF0F0; --surface:#FFFFFF; --ink:#1F4172; --ink-soft:#6B756F; --subtitle:#F1B4BB;
    --jade:#2F5D50; --jade-dark:#1E3D35; --jade-tint:#E4EDE9;
    --chili:#C1443C; --chili-tint:#F8E5E2; --gold:#B9852D; --gold-tint:#F5EAD3;
    --border:#E7E1D6;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
  }

  .k-head{ padding: calc(env(safe-area-inset-top,0px) + 24px) 20px 18px; text-align:center; flex-shrink:0; border-bottom:1px solid var(--border); }
  .k-head .km-logo{ width:56px; height:56px; border-radius:50%; overflow:hidden; margin:0 auto 10px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .k-head .km-logo img{ width:100%; height:100%; object-fit:cover; }
  .k-head .km-brand{ font-family:'Fraunces',serif; font-weight:700; font-size:23px; color:var(--ink); letter-spacing:-0.01em; }
  .k-head .sub{ font-size:17px; color:var(--subtitle); font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:4px; }

  .k-body{ flex:1; padding:20px 22px; max-width:480px; margin:0 auto; width:100%; }
  #kertasContent .kat-block{ margin-bottom:18px; }
  #kertasContent .kat-block:last-child{ margin-bottom:0; }
  #kertasContent .kat-title{
    font-family:'Fraunces',serif; font-weight:600; color:var(--subtitle);
    text-transform:uppercase; letter-spacing:.05em; font-size:14px;
    margin:0 0 7px; padding-bottom:4px; border-bottom:1px dashed var(--border);
  }
  #kertasContent .item-line{ display:flex; align-items:baseline; gap:8px; padding:4px 0; font-size:15px; }
  #kertasContent .item-line .nama{ font-weight:600; color:var(--ink); }
  #kertasContent .item-line .dots{ flex:1; border-bottom:1.5px dotted #C9C2B6; transform:translateY(-3px); min-width:16px; }
  #kertasContent .item-line .harga{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--jade-dark); font-size:13.5px; white-space:nowrap; }

  .k-foot{ text-align:center; flex-shrink:0; color:var(--ink-soft); padding:8px 16px 4px; font-size:11px; }
  .updated-note{ text-align:center; flex-shrink:0; color:var(--ink-soft); padding:0 16px calc(env(safe-area-inset-bottom,0px) + 20px); font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.8; }

  .empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; color:var(--ink-soft); gap:8px; }
  .empty-state .glyph{ font-size:34px; }
  .spinner{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px; }
</style>

<script>
// Endpoint publik ini SENGAJA cuma manggil get_published_menu — nggak pernah manggil
// get_menu/get_orders, jadi data order & customer nggak pernah nyampe ke halaman ini.
const API_URL = 'https://script.google.com/macros/s/AKfycbwLmowhGm_KJB-JKVi2WuhMyUR5jPm5N-oVA6JE61oV7PbCHbU_FsDl-qg5VbK2ZQ4z7w/exec';

function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function rupiah(n){ return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
function formatWaktu(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('id-ID', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }) + ' WIB';
}

async function load(){
  const bodyEl = document.getElementById('kBody');
  const footEl = document.getElementById('footArea');
  try{
    const res = await fetch(API_URL + '?action=get_published_menu');
    const json = await res.json();
    if(json.status !== 'ok') throw new Error(json.message || 'Gagal memuat');
    const data = json.data;

    if(!data.categories || data.categories.length === 0){
      bodyEl.innerHTML = `<div class="empty-state"><div class="glyph">📭</div>Belum ada menu dipublish hari ini.<br>Cek lagi nanti ya.</div>`;
      return;
    }

    bodyEl.innerHTML = `<div id="kertasContent">${data.categories.map(cat => `
      <div class="kat-block">
        <div class="kat-title">${escapeHtml(cat.kategori)}</div>
        ${cat.items.map(it => `
          <div class="item-line">
            <span class="nama">${escapeHtml(it.nama)}</span>
            <span class="dots"></span>
            <span class="harga">${rupiah(it.harga)}</span>
          </div>`).join('')}
      </div>`).join('')}</div>`;

    footEl.innerHTML = `
      <div class="k-foot">Order via chat / DM — kuota terbatas per hari</div>
      <div class="updated-note">Terakhir diupdate: ${formatWaktu(data.publishedAt)}</div>`;
  } catch(e){
    bodyEl.innerHTML = `<div class="empty-state"><div class="glyph">⚠️</div>Gagal memuat menu.<br>Coba refresh halaman ini lagi.</div>`;
  }
}
load();
</script>
</body>
</html>
